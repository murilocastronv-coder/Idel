# Blueprint SÓ do site de teste (branch "teste"). Não mexe no jogo de verdade nem no banco dos jogadores.
services:
  - type: web
    name: muonline-teste
    runtime: node
    plan: free
    region: frankfurt
    branch: teste
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PG_SCHEMA
        value: muidle
      - key: DATABASE_URL
        fromDatabase:
          name: muonline-teste-db
          property: connectionString

databases:
  - name: muonline-teste-db
    plan: basic_256mb
    region: frankfurt
    diskSizeGB: 1
    databaseName: muonline_teste_db
    user: muonline_teste_db_user
